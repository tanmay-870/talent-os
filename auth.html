<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Sign Up – TalentOS</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .auth-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 80px);
      padding: 2rem;
    }
    .auth-card {
      width: 100%;
      max-width: 480px;
      padding: 3rem 2.5rem;
    }
    .auth-tabs {
      display: flex;
      background: rgba(0, 0, 0, 0.4);
      border-radius: var(--radius-sm);
      margin-bottom: 2rem;
      padding: 0.35rem;
    }
    .auth-tab {
      flex: 1;
      text-align: center;
      padding: 0.75rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text-secondary);
      transition: all 0.2s ease;
    }
    .auth-tab.active {
      background: var(--accent-primary);
      color: #fff;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
    }
    .input-group {
      margin-bottom: 1.25rem;
    }
    .input-group label {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-secondary);
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .input-group label a {
      color: var(--accent-primary);
      text-decoration: none;
      font-weight: 500;
    }
    .input-group label a:hover {
      text-decoration: underline;
    }
    .input-group input {
      width: 100%;
      padding: 0.85rem 1rem;
      border-radius: var(--radius-sm);
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
      color: #fff;
      font-size: 1rem;
      transition: border-color 0.2s ease;
    }
    .input-group input:focus {
      outline: none;
      border-color: var(--accent-primary);
    }
    .error-msg {
      color: var(--accent-danger);
      font-size: 0.85rem;
      margin-top: 0.25rem;
      display: none;
    }
    .social-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      padding: 0.85rem;
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 1rem;
      transition: background 0.2s ease;
    }
    .social-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 1.5rem 0;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border-color);
    }
    .divider:not(:empty)::before { margin-right: .5em; }
    .divider:not(:empty)::after { margin-left: .5em; }
    
    .toggle-form {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }
    .toggle-form span {
      color: var(--accent-primary);
      cursor: pointer;
      font-weight: 600;
    }
    .toggle-form span:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Minimal Navbar for Auth -->
  <nav class="navbar" style="justify-content: center;">
    <a href="index.html" class="logo">
      <span>TalentOS</span>
      <span class="logo-badge">AI 360°</span>
    </a>
  </nav>

  <main class="auth-container">
    <div class="card glass auth-card">
      <div style="text-align: center; margin-bottom: 2rem;">
        <h1 style="font-size: 1.85rem; font-weight: 800; margin-bottom: 0.5rem;" id="formTitle">Sign In to TalentOS</h1>
        <p style="color: var(--text-secondary); font-size: 0.95rem;" id="formSubtitle">Access your dashboard to continue.</p>
      </div>

      <div class="auth-tabs">
        <div class="auth-tab active" id="tabStudent" onclick="switchTab('student')">🎓 Student</div>
        <div class="auth-tab" id="tabRecruiter" onclick="switchTab('recruiter')">💼 Recruiter</div>
      </div>

      <button class="social-btn" id="githubBtn" onclick="handleSocialLogin()">
        <img src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" alt="GitHub" style="width: 20px; filter: invert(1);">
        Continue with GitHub
      </button>

      <button class="social-btn" id="googleBtn" onclick="handleSocialLogin()">
        <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google" style="width: 20px;">
        Continue with Google
      </button>

      <div class="divider">or continue with email</div>

      <!-- Registration specific field (hidden by default) -->
      <div class="input-group" id="nameField" style="display: none;">
        <label>Full Name</label>
        <input type="text" placeholder="John Doe" id="nameInput">
      </div>

      <div class="input-group">
        <label>Email Address</label>
        <input type="email" placeholder="you@example.com" id="emailInput">
        <div class="error-msg" id="emailError">Please enter a valid email address.</div>
      </div>
      
      <div class="input-group">
        <label>
          <span>Password</span>
          <a href="#" id="forgotPassword" onclick="alert('Password reset link sent to your email!')">Forgot Password?</a>
        </label>
        <input type="password" placeholder="••••••••" id="passInput">
        <div class="error-msg" id="passError">Password is required.</div>
      </div>

      <button class="btn btn-primary" id="submitBtn" style="width: 100%; padding: 0.85rem;" onclick="handleEmailSubmit()">
        Sign In
      </button>

      <div class="toggle-form">
        <span id="toggleText" onclick="toggleFormMode()">Don't have an account? Sign up</span>
      </div>

      <p style="text-align: center; margin-top: 1.5rem; font-size: 0.75rem; color: var(--text-muted);">
        By proceeding, you agree to our Terms of Service & Privacy Policy.
      </p>
    </div>
  </main>

  <script>
    let currentRole = 'student';
    let isLogin = true;

    function switchTab(role) {
      currentRole = role;
      document.getElementById('tabStudent').classList.remove('active');
      document.getElementById('tabRecruiter').classList.remove('active');
      
      if (role === 'student') {
        document.getElementById('tabStudent').classList.add('active');
        document.getElementById('githubBtn').style.display = 'flex';
      } else {
        document.getElementById('tabRecruiter').classList.add('active');
        document.getElementById('githubBtn').style.display = 'none';
      }
    }

    function toggleFormMode() {
      isLogin = !isLogin;
      const title = document.getElementById('formTitle');
      const subtitle = document.getElementById('formSubtitle');
      const submitBtn = document.getElementById('submitBtn');
      const toggleText = document.getElementById('toggleText');
      const nameField = document.getElementById('nameField');
      const forgotPassword = document.getElementById('forgotPassword');

      if (isLogin) {
        title.innerText = 'Sign In to TalentOS';
        subtitle.innerText = 'Access your dashboard to continue.';
        submitBtn.innerText = 'Sign In';
        toggleText.innerText = "Don't have an account? Sign up";
        nameField.style.display = 'none';
        forgotPassword.style.display = 'block';
      } else {
        title.innerText = 'Create an Account';
        subtitle.innerText = 'Join TalentOS and boost your hiring process.';
        submitBtn.innerText = 'Sign Up';
        toggleText.innerText = "Already have an account? Sign in";
        nameField.style.display = 'block';
        forgotPassword.style.display = 'none';
      }
    }

    function navigateToDashboard() {
      const btn = document.getElementById('submitBtn');
      btn.innerHTML = '🔄 Authenticating...';
      
      setTimeout(() => {
        if (currentRole === 'student') {
          window.location.href = 'student.html';
        } else {
          window.location.href = 'recruiter.html';
        }
      }, 1000);
    }

    function handleSocialLogin() {
      navigateToDashboard();
    }

    function handleEmailSubmit() {
      const email = document.getElementById('emailInput').value;
      const pass = document.getElementById('passInput').value;
      
      let isValid = true;

      // Simple Validation
      if (!email.includes('@')) {
        document.getElementById('emailError').style.display = 'block';
        isValid = false;
      } else {
        document.getElementById('emailError').style.display = 'none';
      }

      if (pass.length < 1) {
        document.getElementById('passError').style.display = 'block';
        isValid = false;
      } else {
        document.getElementById('passError').style.display = 'none';
      }

      if (isValid) {
        navigateToDashboard();
      }
    }
  </script>
</body>
</html>
